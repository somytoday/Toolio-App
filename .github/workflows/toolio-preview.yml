name: Toolio Website Preview

on:
  push:
    branches:
      - codex/toolio-website-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolio-website-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Vercel project exists
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: '1'
        shell: bash
        run: |
          if ! npx --yes vercel@59.10.0 project inspect toolio-live \
            --scope=tahirs-projects-c4817c0a \
            --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            npx --yes vercel@59.10.0 project add toolio-live \
              --scope=tahirs-projects-c4817c0a \
              --token="$VERCEL_TOKEN"
          fi

      - name: Deploy preview to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: '1'
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing repository secret: VERCEL_TOKEN" >&2
            exit 1
          fi

          set +e
          deploy_output="$(npx --yes vercel@59.10.0 deploy website \
            --debug \
            --yes \
            --no-color \
            --archive=tgz \
            --target=preview \
            --project=toolio-live \
            --scope=tahirs-projects-c4817c0a \
            --token="$VERCEL_TOKEN" 2>&1)"
          deploy_status=$?
          set -e

          safe_output="${deploy_output//$VERCEL_TOKEN/[REDACTED]}"
          printf '%s\n' "$safe_output"

          if [ "$deploy_status" -ne 0 ]; then
            annotation="$(printf '%s' "$safe_output" | tail -n 20 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Vercel deployment failed::$annotation"
            exit "$deploy_status"
          fi

          deployment_url="$(printf '%s\n' "$safe_output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "::error title=Vercel preview URL missing::Deployment succeeded but no vercel.app URL was found."
            exit 1
          fi

          echo "::notice title=Toolio preview::$deployment_url"

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Toolio preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test deployed routes
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          routes=(
            "/"
            "/store/"
            "/store/product.html?product=toolio-premium"
            "/download/"
            "/admin/"
          )

          for route in "${routes[@]}"; do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "${PREVIEW_URL}${route}")"
            if [ "$status" != "200" ]; then
              echo "::error title=Toolio route failed::${route} returned HTTP ${status}"
              exit 1
            fi
          done

          home_html="$(curl --silent --show-error --fail --location "${PREVIEW_URL}/")"
          if ! grep -qi "TOOLIO" <<< "$home_html"; then
            echo "::error title=Unexpected Toolio homepage::The deployed homepage does not contain the Toolio brand."
            exit 1
          fi

          echo "::notice title=Toolio smoke test::All five preview routes returned HTTP 200 and the homepage contains the Toolio brand."

      - name: Show preview URL
        run: echo "${{ steps.deploy.outputs.url }}"
