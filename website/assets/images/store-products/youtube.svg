<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ytBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140606" />
      <stop offset="50%" stop-color="#1c0a0a" />
      <stop offset="100%" stop-color="#0c0404" />
    </linearGradient>
    <radialGradient id="ytGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#ff0000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ytBg)" />
  <circle cx="400" cy="175" r="220" fill="url(#ytGlow)" />

  <!-- YouTube Official Play Button Emblem -->
  <g transform="translate(400, 168) scale(1.15)">
    <!-- Red rounded pill box -->
    <rect x="-65" y="-45" width="130" height="90" rx="26" fill="#ff0000" />
    <!-- White play triangle -->
    <polygon points="-12,-22 24,0 -12,22" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">YouTube Premium</text>
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#ff0000" text-anchor="middle" letter-spacing="3" text-transform="uppercase">Ad-Free · Background Play · YT Music</text>
</svg>
