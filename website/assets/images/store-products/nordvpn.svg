<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="nordBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0c152a" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <radialGradient id="nordGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#4687ff" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#4687ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#4687ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#nordBg)" />
  <circle cx="400" cy="175" r="220" fill="url(#nordGlow)" />

  <!-- NordVPN Mountain Peak Emblem -->
  <g transform="translate(400, 168) scale(1.15)">
    <!-- Outer Shield / Circle -->
    <circle cx="0" cy="0" r="58" fill="#4687ff" />
    <!-- Mountain Peaks -->
    <polygon points="-38,32 0,-34 38,32 16,32 0,0 -16,32" fill="#ffffff" />
    <polygon points="-16,32 0,0 16,32 0,16" fill="#0c152a" opacity="0.2" />
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NordVPN</text>
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4687ff" text-anchor="middle" letter-spacing="3" text-transform="uppercase">Threat Protection · 6,000+ Servers · 10 Devices</text>
</svg>
