<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="mjBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0c1124" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <radialGradient id="mjGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#4f6df5" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#4f6df5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#4f6df5" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#mjBg)" />
  <circle cx="400" cy="175" r="220" fill="url(#mjGlow)" />

  <!-- Midjourney Sailboat Mark -->
  <g transform="translate(400, 168) scale(1.15)">
    <!-- Sailboat Hull and Sails -->
    <path d="M-45 28 C-30 40 30 40 45 28 C30 34 -30 34 -45 28 Z" fill="#ffffff" />
    <!-- Big Sail -->
    <path d="M-8 20 C-6 -15 -2 -45 12 -58 C6 -25 0 0 -8 20 Z" fill="#ffffff" />
    <!-- Front Sail -->
    <path d="M-12 18 C-25 -5 -35 -25 -28 -38 C-20 -20 -15 2 -12 18 Z" fill="#4f6df5" opacity="0.9" />
    <!-- Water Ripple lines -->
    <path d="M-55 36 C-30 42 30 42 55 36" stroke="#4f6df5" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Midjourney Pro</text>
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4f6df5" text-anchor="middle" letter-spacing="3" text-transform="uppercase">V8.2 Engine · Fast GPU &amp; Stealth</text>
</svg>
