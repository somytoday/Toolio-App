<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="netflixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140606" />
      <stop offset="50%" stop-color="#1a0808" />
      <stop offset="100%" stop-color="#0d0404" />
    </linearGradient>
    <radialGradient id="netflixGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#e50914" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#e50914" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#b20710" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#netflixBg)" />
  <circle cx="400" cy="175" r="220" fill="url(#netflixGlow)" />

  <!-- Netflix Bold N Ribbon Icon -->
  <g transform="translate(400, 168) scale(1.15)">
    <!-- Left Vertical Stem -->
    <rect x="-35" y="-60" width="22" height="120" rx="3" fill="#b20710" />
    <!-- Right Vertical Stem -->
    <rect x="13" y="-60" width="22" height="120" rx="3" fill="#b20710" />
    <!-- Diagonal Fold Ribbon -->
    <polygon points="-35,-60 -13,-60 35,60 13,60" fill="url(#nGrad)" />
    <!-- Drop Shadow on diagonal edge -->
    <polygon points="-13,-60 -9,-60 17,60 13,60" fill="#000000" opacity="0.3" />
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Netflix Premium</text>
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e50914" text-anchor="middle" letter-spacing="3" text-transform="uppercase">4K Ultra HD · 4 Screens · HDR</text>
</svg>
