<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="capcutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d14" />
      <stop offset="50%" stop-color="#0f1926" />
      <stop offset="100%" stop-color="#070b10" />
    </linearGradient>
    <radialGradient id="capcutGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#capcutBg)" />
  <circle cx="400" cy="175" r="220" fill="url(#capcutGlow)" />

  <!-- CapCut Bowtie / Overlapping Trapezoids Emblem -->
  <g transform="translate(400, 168) scale(1.15)">
    <!-- Left Top Piece -->
    <path d="M-55 -45 L-12 -10 L-32 -10 L-68 -35 Z" fill="#00e5ff" />
    <!-- Left Bottom Piece -->
    <path d="M-55 45 L-12 10 L-32 10 L-68 35 Z" fill="#00e5ff" />
    <!-- Right Top Piece -->
    <path d="M55 -45 L12 -10 L32 -10 L68 -35 Z" fill="#ffffff" />
    <!-- Right Bottom Piece -->
    <path d="M55 45 L12 10 L32 10 L68 35 Z" fill="#ffffff" />
    <!-- Center connecting diamond -->
    <polygon points="0 -18 18 0 0 18 -18 0" fill="#00e5ff" opacity="0.85" />
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CapCut Pro</text>
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#00e5ff" text-anchor="middle" letter-spacing="3" text-transform="uppercase">ByteDance · 4K 60FPS &amp; AI Tools</text>
</svg>
