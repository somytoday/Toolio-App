<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="canvaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="50%" stop-color="#0e1428" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>
    <radialGradient id="canvaGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#00c4cc" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#7d2ae8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00c4cc" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="canvaCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c4cc" />
      <stop offset="100%" stop-color="#7d2ae8" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#canvaBg)" />
  <circle cx="400" cy="175" r="220" fill="url(#canvaGlow)" />

  <!-- Canva Brand Circle + Typography -->
  <g transform="translate(400, 168) scale(1.15)">
    <circle cx="0" cy="0" r="58" fill="url(#canvaCircleGrad)" />
    <!-- Stylized "Canva" script text / C glyph -->
    <text x="0" y="16" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="52" font-style="italic" font-weight="900" fill="#ffffff" text-anchor="middle">Canva</text>
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Canva Pro</text>
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#00c4cc" text-anchor="middle" letter-spacing="3" text-transform="uppercase">Magic Studio AI · 100M+ Assets · 1TB</text>
</svg>
