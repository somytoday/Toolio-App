<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="geminiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1c" />
      <stop offset="50%" stop-color="#10172e" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>
    <radialGradient id="geminiGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#4285f4" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#9b72cb" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4285f4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="geminiStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ba0e2" />
      <stop offset="45%" stop-color="#4285f4" />
      <stop offset="75%" stop-color="#9b72cb" />
      <stop offset="100%" stop-color="#d96570" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#geminiBg)" />
  <circle cx="400" cy="175" r="230" fill="url(#geminiGlow)" />

  <!-- Google Gemini 4-point Sparkle Star -->
  <g transform="translate(400, 170) scale(1.05)">
    <path d="M0 -75 C2 -20 20 -2 75 0 C20 2 2 20 0 75 C-2 20 -20 2 -75 0 C-20 -2 -2 -20 0 -75 Z" fill="url(#geminiStarGrad)" />
    <!-- Secondary small sparkle -->
    <path d="M45 -45 C46 -25 55 -18 75 -16 C55 -14 46 -7 45 15 C44 -7 35 -14 15 -16 C35 -18 44 -25 45 -45 Z" fill="#ffffff" opacity="0.8" transform="scale(0.5) translate(40, -40)" />
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Gemini Advanced</text>
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#4285f4" text-anchor="middle" letter-spacing="3" text-transform="uppercase">Google · Gemini 3.7 Flash &amp; 2TB Cloud</text>
</svg>
