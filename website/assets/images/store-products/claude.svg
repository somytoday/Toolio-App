      <stop offset="0%" stop-color="#140e0b" />
      <stop offset="50%" stop-color="#1c130d" />
      <stop offset="100%" stop-color="#0e0a07" />
    </linearGradient>
    <radialGradient id="claudeGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#d97757" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#d97757" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#claudeBg)" />
