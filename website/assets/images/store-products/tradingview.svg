<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="tvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1524" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <radialGradient id="tvGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#2962ff" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#2962ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#2962ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#tvBg)" />
  <circle cx="400" cy="175" r="220" fill="url(#tvGlow)" />

  <!-- Technical chart background grid -->
  <g opacity="0.06" stroke="#2962ff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- TradingView Connected TV Shape Mark -->
  <g transform="translate(400, 168) scale(1.15)">
    <!-- T top bar & V connected vector -->
    <path d="M-60 -36 L-60 -18 L-22 -18 L-22 36 L0 36 L0 -18 L38 -18 L38 -36 Z" fill="#ffffff" />
    <path d="M12 -18 L32 36 L52 36 L72 -18 L50 -18 L42 12 L34 -18 Z" fill="#2962ff" />
    <!-- Candlestick chart mini icon -->
    <rect x="-80" y="-10" width="8" height="24" rx="1" fill="#089981" />
    <line x1="-76" y1="-22" x2="-76" y2="28" stroke="#089981" stroke-width="2" />
    <rect x="85" y="-5" width="8" height="20" rx="1" fill="#f23645" />
    <line x1="89" y1="-18" x2="89" y2="24" stroke="#f23645" stroke-width="2" />
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TradingView Premium</text>
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#2962ff" text-anchor="middle" letter-spacing="3" text-transform="uppercase">25 Indicators · 8 Charts · Bar Replay</text>
</svg>
