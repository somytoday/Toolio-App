<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="spotifyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07120a" />
      <stop offset="50%" stop-color="#0a1a0f" />
      <stop offset="100%" stop-color="#050d07" />
    </linearGradient>
    <radialGradient id="spotifyGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#1db954" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1db954" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#spotifyBg)" />
  <circle cx="400" cy="175" r="220" fill="url(#spotifyGlow)" />

  <!-- Spotify Official Circle with Soundwaves -->
  <g transform="translate(400, 168) scale(1.15)">
    <circle cx="0" cy="0" r="58" fill="#1db954" />
    <!-- 3 curved soundwaves -->
    <path d="M-36 -18 C-8 -28 18 -26 36 -16" stroke="#000000" stroke-width="8.5" fill="none" stroke-linecap="round" />
    <path d="M-30 4 C-6 -4 15 -3 30 5" stroke="#000000" stroke-width="7.5" fill="none" stroke-linecap="round" />
    <path d="M-24 24 C-4 18 12 19 24 25" stroke="#000000" stroke-width="6.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Spotify Premium</text>
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1db954" text-anchor="middle" letter-spacing="3" text-transform="uppercase">Ad-Free · 320kbps Audio · Offline</text>
</svg>
